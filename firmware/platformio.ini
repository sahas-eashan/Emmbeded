; Bird Repellent System - ESP32-WROOM-32
;   pio run -e hwtest -t upload -t monitor   -> module-by-module hardware test
;   pio run -e main   -t upload -t monitor   -> final firmware (Review 3 behaviour)

[env]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder
lib_deps =
    dfrobot/DFRobotDFPlayerMini @ 1.0.6
build_flags = -Wall

[env:hwtest]
build_src_filter = +<common/> +<hwtest/>

[env:main]
build_src_filter = +<common/> +<app/>

; ---- Standalone sensor test sketches (src/tests/<name>.cpp) ----
;   pio run -e pir -t upload --upload-port COM3
[env:pir]
build_src_filter = +<tests/pir_test.cpp>
